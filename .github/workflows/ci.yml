name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Caches the global NuGet package folder. Keyed on the project/build files so the cache
      # is reused until a dependency changes; restore-keys lets an older cache seed a new one.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Fast suites: convention (MyOS.Tests), unit (MyOS.UnitTests) and architecture
      # (MyOS.ArchitectureTests). Integration tests need a real SQL Server and run in the
      # separate job below, so they are excluded here by category.
      - name: Test
        run: dotnet test --configuration Release --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Testcontainers starts SQL Server via the Docker daemon that ships on ubuntu-latest —
      # no service container needed. The fixture runs the real migrations + view sync.
      - name: Test (integration)
        run: dotnet test MyOS.IntegrationTests/MyOS.IntegrationTests.csproj --configuration Release --filter "Category=Integration"
