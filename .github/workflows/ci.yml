name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Caches the global NuGet package folder. Keyed on the project/build files so the cache
      # is reused until a dependency changes; restore-keys lets an older cache seed a new one.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Runs every test project in the solution: convention (MyOS.Tests),
      # unit (MyOS.UnitTests) and architecture (MyOS.ArchitectureTests).
      # Integration tests (real SQL Server) are intentionally out of scope for now and,
      # once added, will run in a separate job with a Docker service.
      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
